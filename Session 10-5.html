<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let a = parseInt(prompt(" Nhap so thu nhat :"));
        let b = parseInt(prompt(" Nhap so thu hai :"));

        var message = (a % b === 0) ? 
            a + " là bội số của " + b : 
            a + " không phải là bội số của " + b;
        
        alert(message);
    </script>
</body>
</html>

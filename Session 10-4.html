<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    <h1>Dien tich hinh chu nhat </h1>
    <script>
        let width = 30;
        let height = 15;
        let area = width*height;
        document.write(" Chieu rong hinh chu nhat :" + width + "<br>");
        document.write(" Chieu dai hinh chu nhat :" + height + "<br>");
        document.write(" Dien tich hinh chu nhat :" + area + "<br>");
    </script>
</body>
</html>
